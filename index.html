<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>App Học Ngôn Ngữ</title>
  <meta http-equiv="refresh" content="3;url=http://localhost:3000/" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      max-width: 500px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dự án Next.js đã được cấu hình!</h2>
    <p>Giao diện Từ vựng 10.000 từ nằm ở ứng dụng chính Next.js (thư mục <code>apps/web</code>).</p>
    <p>Đang tự động chuyển hướng đến <b>http://localhost:3000</b> trong 3 giây...</p>
    <a href="http://localhost:3000/">Truy cập ứng dụng ngay</a>
  </div>
</body>
</html>
